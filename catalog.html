<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MAISON BLEU — Полный Каталог</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg-body: #f8fafc;
      --bg-surface: #ffffff;
      --bg-subtle: #f1f5f9;
      --navy-dark: #091224;
      --navy-deep: #0f172a;
      --blue-electric: #2563eb;
      --whatsapp-gradient: linear-gradient(135deg, #128c7e 0%, #25d366 100%);
      --text-main: #0f172a;
      --text-muted: #475569;
      --border-light: #e2e8f0;
      --shadow-sm: 0 4px 12px rgba(15, 23, 42, 0.04);
      --shadow-md: 0 10px 25px rgba(15, 23, 42, 0.08);
      --shadow-lg: 0 20px 45px rgba(15, 23, 42, 0.12);
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-full: 9999px;
      --transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Montserrat', sans-serif; }
    body { background-color: var(--bg-body); color: var(--text-main); font-weight: 700; padding-bottom: 70px; }

    header {
      position: sticky; top: 0; z-index: 100;
      backdrop-filter: blur(20px); background: rgba(255, 255, 255, 0.94);
      border-bottom: 2px solid var(--border-light); padding: 14px 5%;
      display: flex; justify-content: space-between; align-items: center;
    }
    .logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
    .logo-symbol { width: 40px; height: 40px; background: var(--navy-deep); border: 2px solid var(--blue-electric); border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #fff; }
    .logo-text { font-size: 1.6rem; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; background: linear-gradient(135deg, #0f172a 0%, #2563eb 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

    .header-actions { display: flex; align-items: center; gap: 16px; }
    .search-box { position: relative; width: 230px; }
    .search-box input { width: 100%; padding: 10px 14px 10px 38px; background: var(--bg-subtle); border: 2px solid var(--border-light); border-radius: var(--radius-full); font-size: 0.82rem; font-weight: 700; outline: none; }
    .search-box i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }

    .cart-trigger-btn { background: var(--navy-deep); border: 2px solid var(--blue-electric); color: #fff; padding: 10px 20px; border-radius: var(--radius-full); display: flex; align-items: center; gap: 10px; cursor: pointer; font-weight: 800; font-size: 0.82rem; text-transform: uppercase; }
    .cart-badge { background: #d4af37; color: var(--navy-dark); font-size: 0.75rem; padding: 2px 7px; border-radius: var(--radius-full); }

    .catalog-section { max-width: 1600px; margin: 0 auto; padding: 30px 2% 70px; }
    .catalog-controls { display: flex; gap: 16px; align-items: center; justify-content: space-between; margin-bottom: 20px; flex-wrap: wrap; }
    .categories-pills { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; }
    .category-pill { background: var(--bg-surface); border: 2px solid var(--border-light); color: var(--text-muted); padding: 7px 16px; border-radius: var(--radius-full); font-size: 0.75rem; font-weight: 800; text-transform: uppercase; cursor: pointer; white-space: nowrap; }
    .category-pill.active { background: var(--navy-deep); color: #fff; border-color: var(--blue-electric); }

    .sort-dropdown { padding: 8px 16px; background: var(--bg-surface); border: 2px solid var(--border-light); border-radius: var(--radius-full); font-size: 0.75rem; font-weight: 800; text-transform: uppercase; cursor: pointer; outline: none; }

    /* 6-Column Compact Grid */
    .products-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; }
    @media (max-width: 1400px) { .products-grid { grid-template-columns: repeat(5, 1fr); } }
    @media (max-width: 1100px) { .products-grid { grid-template-columns: repeat(4, 1fr); } }
    @media (max-width: 850px) { .products-grid { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 580px) { .products-grid { grid-template-columns: repeat(2, 1fr); } }

    .product-card { background: var(--bg-surface); border: 1.5px solid var(--border-light); border-radius: var(--radius-sm); padding: 10px; display: flex; flex-direction: column; position: relative; }
    .product-img-box { position: relative; width: 100%; height: 160px; border-radius: 4px; overflow: hidden; margin-bottom: 8px; background: var(--bg-subtle); }
    .product-img-box img { width: 100%; height: 100%; object-fit: cover; }
    .badge-tag { position: absolute; top: 6px; left: 6px; background: var(--navy-dark); color: #fff; padding: 2px 6px; border-radius: 99px; font-size: 0.55rem; text-transform: uppercase; }
    .product-name { font-size: 0.85rem; font-weight: 900; text-transform: uppercase; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .product-desc { font-size: 0.68rem; color: var(--text-muted); margin-bottom: 8px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; height: 2.1em; }
    .size-selector { display: flex; gap: 4px; margin-bottom: 8px; flex-wrap: wrap; }
    .size-btn { padding: 3px 6px; border: 1px solid var(--border-light); background: var(--bg-subtle); border-radius: 4px; font-size: 0.62rem; font-weight: 900; cursor: pointer; }
    .size-btn.active { background: var(--blue-electric); color: #fff; border-color: var(--blue-electric); }
    .product-footer { display: flex; justify-content: space-between; align-items: center; margin-top: auto; padding-top: 8px; border-top: 1px solid var(--bg-subtle); }
    .price-main { font-size: 0.95rem; font-weight: 900; }
    .add-to-cart-btn { background: var(--navy-deep); color: #fff; border: 1px solid var(--blue-electric); padding: 5px 10px; border-radius: 99px; font-size: 0.62rem; font-weight: 900; text-transform: uppercase; cursor: pointer; }

    /* Cart Drawer */
    .cart-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.55); backdrop-filter: blur(8px); z-index: 300; opacity: 0; pointer-events: none; transition: var(--transition); }
    .cart-overlay.active { opacity: 1; pointer-events: all; }
    .cart-drawer { position: fixed; top: 0; right: -480px; width: 100%; max-width: 480px; height: 100vh; background: var(--bg-surface); z-index: 301; display: flex; flex-direction: column; transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
    .cart-overlay.active .cart-drawer { transform: translateX(-480px); }
    .cart-head { padding: 24px; border-bottom: 2px solid var(--border-light); display: flex; justify-content: space-between; align-items: center; }
    .cart-body { flex-grow: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
    .cart-item-row { display: flex; gap: 14px; background: var(--bg-body); border: 2px solid var(--border-light); border-radius: var(--radius-sm); padding: 12px; align-items: center; }
    .cart-item-row img { width: 60px; height: 75px; object-fit: cover; border-radius: 4px; }
    .cart-foot { padding: 22px; border-top: 2px solid var(--border-light); background: var(--bg-surface); }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 0.72rem; font-weight: 900; text-transform: uppercase; margin-bottom: 4px; color: var(--text-muted); }
    .form-group input { width: 100%; padding: 10px 14px; background: var(--bg-body); border: 2px solid var(--border-light); border-radius: var(--radius-sm); font-size: 0.85rem; font-weight: 700; outline: none; }
    .btn-whatsapp-order { background: var(--whatsapp-gradient); color: #fff; padding: 14px; border-radius: 99px; font-weight: 900; text-transform: uppercase; border: none; cursor: pointer; width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; }
    .toast-box { position: fixed; bottom: 25px; left: 25px; z-index: 500; display: flex; flex-direction: column; gap: 10px; }
    .toast-msg { background: var(--navy-dark); color: #fff; padding: 12px 20px; border-radius: 8px; font-size: 0.8rem; font-weight: 800; text-transform: uppercase; }
  </style>
</head>
<body>

  <header>
    <a href="index.html" class="logo">
      <div class="logo-symbol"><i class="fa-solid fa-crown"></i></div>
      <div class="logo-text">MAISON BLEU</div>
    </a>
    <div class="header-actions">
      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="search-input" placeholder="Поиск товаров..." oninput="handleSearch()">
      </div>
      <button class="cart-trigger-btn" onclick="toggleCartDrawer()">
        <i class="fa-solid fa-bag-shopping"></i>
        <span>Корзина</span>
        <div class="cart-badge" id="cart-badge">0</div>
      </button>
    </div>
  </header>

  <section class="catalog-section">
    <div style="margin-bottom: 20px;">
      <a href="index.html" style="font-size: 0.8rem; font-weight: 900; color: var(--blue-electric); text-decoration: none; text-transform: uppercase;"><i class="fa-solid fa-arrow-left"></i> На главную</a>
      <h1 style="font-size: 2rem; font-weight: 900; text-transform: uppercase; margin-top: 6px;">Полный Каталог Товаров</h1>
    </div>

    <div class="catalog-controls">
      <div class="categories-pills" id="categories-pills"></div>
      <select class="sort-dropdown" id="sort-select" onchange="handleSortChange()">
        <option value="popular">По популярности</option>
        <option value="price-asc">Сначала дешевле</option>
        <option value="price-desc">Сначала дороже</option>
      </select>
    </div>

    <div class="products-grid" id="products-grid"></div>
  </section>

  <!-- Cart Drawer -->
  <div class="cart-overlay" id="cart-overlay" onclick="closeCartOnOverlay(event)">
    <div class="cart-drawer">
      <div class="cart-head">
        <h2>Ваша Корзина</h2>
        <button onclick="toggleCartDrawer()" style="background:none; border:none; font-size:1.2rem; cursor:pointer;"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="cart-body" id="cart-items-container"></div>
      <div class="cart-foot">
        <form onsubmit="submitOrderToWhatsApp(event)">
          <div class="form-group"><label>ФИО *</label><input type="text" id="order-name" required></div>
          <div class="form-group"><label>Телефон / WhatsApp *</label><input type="tel" id="order-phone" required></div>
          <div class="form-group"><label>Адрес *</label><input type="text" id="order-address" required></div>
          <div style="display:flex; justify-content:space-between; font-size:1.1rem; font-weight:900; margin:14px 0;">
            <span>Итого:</span><span id="cart-total" style="color:var(--blue-electric);">0 ₸</span>
          </div>
          <button type="submit" class="btn-whatsapp-order"><i class="fa-brands fa-whatsapp"></i> Оформить в WhatsApp</button>
        </form>
      </div>
    </div>
  </div>

  <div class="toast-box" id="toast-box"></div>

  <script>
    const WHATSAPP_PHONE = "+77081477426";
    const PRODUCTS = [
      { id: 1, title: "Пальто Cashmere Navy", category: "outerwear", price: 245000, tag: "HIT", sizes: ["S", "M", "L", "XL"], img: "https://images.unsplash.com/photo-1539109136881-3be0616acf4b?auto=format&fit=crop&w=800&q=80", desc: "Двубортное пальто из кашемира." },
      { id: 2, title: "Костюм Tailored Wool", category: "suits", price: 195000, tag: "NEW", sizes: ["48", "50", "52", "54"], img: "https://images.unsplash.com/photo-1594938298603-c8148c4dae35?auto=format&fit=crop&w=800&q=80", desc: "Костюм из шерсти Super 150s." },
      { id: 3, title: "Платье Silk Azure", category: "dresses", price: 135000, tag: "EXCLUSIVE", sizes: ["XS", "S", "M"], img: "https://images.unsplash.com/photo-1572804013309-59a88b7e92f1?auto=format&fit=crop&w=800&q=80", desc: "Платье из натурального шелка." },
      { id: 4, title: "Свитер Alpaca Blue", category: "knitwear", price: 88000, tag: "HIT", sizes: ["S", "M", "L"], img: "https://images.unsplash.com/photo-1620799140408-edc6dcb6d633?auto=format&fit=crop&w=800&q=80", desc: "Оверсайз джемпер из альпака." },
      { id: 5, title: "Куртка Biker Leather", category: "outerwear", price: 210000, tag: "NEW", sizes: ["M", "L", "XL"], img: "https://images.unsplash.com/photo-1551028719-00167b16eac5?auto=format&fit=crop&w=800&q=80", desc: "Куртка из телячьей кожи." },
      { id: 6, title: "Шарф Silk Maison", category: "accessories", price: 42000, tag: "GIFT", sizes: ["ONE SIZE"], img: "https://images.unsplash.com/photo-1601924994987-69e26d50dc26?auto=format&fit=crop&w=800&q=80", desc: "Шелковый фирменный шарф." }
    ];

    const CATEGORIES = [
      { id: 'all', name: 'Все Товары' },
      { id: 'outerwear', name: 'Верхняя Одежда' },
      { id: 'suits', name: 'Костюмы' },
      { id: 'dresses', name: 'Платья' },
      { id: 'knitwear', name: 'Трикотаж' },
      { id: 'accessories', name: 'Аксессуары' }
    ];

    let cart = [];
    let activeCategory = 'all';
    let searchQuery = '';
    let sortOption = 'popular';
    let selectedSizes = {};

    document.addEventListener('DOMContentLoaded', () => {
      PRODUCTS.forEach(p => { selectedSizes[p.id] = p.sizes[0]; });
      renderCategories();
      renderProducts();
      updateCartUI();
    });

    function renderCategories() {
      document.getElementById('categories-pills').innerHTML = CATEGORIES.map(cat => `
        <button class="category-pill ${cat.id === activeCategory ? 'active' : ''}" onclick="setCategory('${cat.id}')">${cat.name}</button>
      `).join('');
    }

    function setCategory(id) { activeCategory = id; renderCategories(); renderProducts(); }
    function handleSearch() { searchQuery = document.getElementById('search-input').value.toLowerCase(); renderProducts(); }
    function handleSortChange() { sortOption = document.getElementById('sort-select').value; renderProducts(); }
    function selectSize(id, size) { selectedSizes[id] = size; renderProducts(); }

    function renderProducts() {
      let filtered = PRODUCTS.filter(p => (activeCategory === 'all' || p.category === activeCategory) && p.title.toLowerCase().includes(searchQuery));
      if (sortOption === 'price-asc') filtered.sort((a,b) => a.price - b.price);
      if (sortOption === 'price-desc') filtered.sort((a,b) => b.price - a.price);

      document.getElementById('products-grid').innerHTML = filtered.map(p => `
        <div class="product-card">
          <div class="product-img-box">
            <span class="badge-tag">${p.tag}</span>
            <img src="${p.img}" alt="${p.title}">
          </div>
          <h3 class="product-name">${p.title}</h3>
          <p class="product-desc">${p.desc}</p>
          <div class="size-selector">
            ${p.sizes.map(s => `<button class="size-btn ${selectedSizes[p.id] === s ? 'active' : ''}" onclick="selectSize(${p.id}, '${s}')">${s}</button>`).join('')}
          </div>
          <div class="product-footer">
            <span class="price-main">${p.price.toLocaleString()} ₸</span>
            <button class="add-to-cart-btn" onclick="addToCart(${p.id})"><i class="fa-solid fa-plus"></i> В корзину</button>
          </div>
        </div>
      `).join('');
    }

    function addToCart(id) {
      let size = selectedSizes[id];
      let item = cart.find(i => i.id === id && i.size === size);
      if (item) item.qty++;
      else {
        let p = PRODUCTS.find(prod => prod.id === id);
        cart.push({...p, size, qty: 1});
      }
      updateCartUI();
      showToast(`Товар добавлен (Размер: ${size})`);
    }

    function updateCartUI() {
      document.getElementById('cart-badge').innerText = cart.reduce((s, i) => s + i.qty, 0);
      document.getElementById('cart-items-container').innerHTML = cart.length === 0 ? '<p style="text-align:center; color:var(--text-muted); padding:30px;">Корзина пуста</p>' : 
        cart.map(i => `
          <div class="cart-item-row">
            <img src="${i.img}" alt="">
            <div style="flex-grow:1;">
              <div style="font-size:0.85rem; font-weight:900;">${i.title} (${i.size})</div>
              <div style="font-size:0.8rem; color:var(--blue-electric); font-weight:900;">${(i.price * i.qty).toLocaleString()} ₸ (x${i.qty})</div>
            </div>
          </div>
        `).join('');
      let total = cart.reduce((s, i) => s + (i.price * i.qty), 0);
      document.getElementById('cart-total').innerText = `${total.toLocaleString()} ₸`;
    }

    function toggleCartDrawer() { document.getElementById('cart-overlay').classList.toggle('active'); }
    function closeCartOnOverlay(e) { if (e.target.id === 'cart-overlay') toggleCartDrawer(); }
    
    function submitOrderToWhatsApp(e) {
      e.preventDefault();
      if (cart.length === 0) return;
      let msg = `Заказ MAISON BLEU 🛍️\nФИО: ${document.getElementById('order-name').value}\nТел: ${document.getElementById('order-phone').value}\nАдрес: ${document.getElementById('order-address').value}\n\n`;
      cart.forEach((i, idx) => { msg += `${idx+1}. ${i.title} (${i.size}) x${i.qty} — ${(i.price*i.qty).toLocaleString()} ₸\n`; });
      window.open(`https://wa.me/${WHATSAPP_PHONE}?text=${encodeURIComponent(msg)}`, '_blank');
    }

    function showToast(msg) {
      let box = document.getElementById('toast-box');
      let t = document.createElement('div');
      t.className = 'toast-msg'; t.innerText = msg;
      box.appendChild(t);
      setTimeout(() => t.remove(), 3000);
    }
  </script>
</body>
</html>
